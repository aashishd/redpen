<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 299" width="1048" height="299" role="img" aria-labelledby="dg1-t"><style>svg{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.bg{fill:#FAF9F6}.sk{stroke:#52514e;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.node.dash,.arrow.dash{stroke-dasharray:6 5}.arrow{fill:none}.ntext{fill:#1f2937}.ntext .b{font-weight:650}.elabel,.glabel{fill:#52514e}.knock{fill:#fcfcfb}.fill-blue{fill:#dbe9f9}.fill-orange{fill:#fbe1d6}.fill-green{fill:#d3f1e5}.fill-purple{fill:#e6e2f6}.fill-gray{fill:#ecebe7}</style><rect class="bg" width="100%" height="100%" rx="12"/><g transform="translate(24 24)"><title id="dg1-t">The RedPen review loop</title><defs><filter id="dg1-sk" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="1" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><marker id="dg1-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" class="sk"/></marker></defs><g filter="url(#dg1-sk)"><rect class="node sk fill-purple" data-id="agent" x="8.0" y="28.0" width="210.5" height="78.6" rx="8"/><rect class="node sk fill-blue" data-id="page" x="266.5" y="28.0" width="187.2" height="78.6" rx="8"/><rect class="node sk fill-orange" data-id="you" x="501.7" y="28.0" width="221.1" height="78.6" rx="8"/><rect class="node sk fill-green" data-id="exit" x="770.9" y="28.0" width="221.1" height="78.6" rx="8"/><rect class="node sk fill-purple" data-id="reply" x="266.5" y="162.6" width="187.2" height="78.6" rx="8"/><rect class="node sk fill-gray" data-id="report" x="501.7" y="162.6" width="221.1" height="78.6" rx="8"/><polyline class="arrow sk" data-from="agent" data-to="page" points="218.5,67.3 266.5,67.3" marker-end="url(#dg1-ah)"/><polyline class="arrow sk" data-from="page" data-to="yo